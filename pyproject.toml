[project]
name = "proxysub"
version = "0.1.0"
description = "Proxy config and subscription manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.5",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.139.0",
  "pwdlib[argon2]>=0.3.0",
  "pydantic[email]>=2.13.4",
  "pyjwt>=2.13.0",
  "python-dotenv>=1.2.2",
  "redis>=8.0.1",
  "slowapi>=0.1.10",
  "sqlalchemy[asyncio,postgresql-asyncpg]>=2.0.51",
  "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.9.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build >= 0.11.23, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

# TODO: tool.typos

[tool.pytest.ini_options]
pythonpath = "."

[tool.ruff.lint]
extend-select = ["ANN", "PYI", "RUF045"]
preview = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
